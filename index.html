<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#080809" />
<title>ROCCO — Digital Menu</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Orbitron:wght@400..900&family=Vazirmatn:wght@100..900&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg: #080809; --accent: #FFC107; --accent-rgb: 255 193 7;
    --font-body: 'Vazirmatn', system-ui, sans-serif;
    --font-display: 'Lalezar', 'Vazirmatn', system-ui, sans-serif;
    --font-latin: 'Orbitron', 'Vazirmatn', system-ui, sans-serif;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; outline: none; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; background: var(--bg); color: #fff; font-family: var(--font-body); overflow-x: hidden; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; touch-action: manipulation; }
  img { display: block; max-width: 100%; }
  .latin { font-family: var(--font-latin); } .display { font-family: var(--font-display); }

  /* Background & Watermark */
  body::before { content: ''; position: fixed; inset: 0; z-index: 0; opacity: .7; pointer-events: none; background: radial-gradient(1200px 620px at 50% -10%, rgba(255,193,7,.07), transparent 70%), radial-gradient(900px 500px at 8% 100%, rgba(0,229,255,.05), transparent 70%); }
  .watermark { position: fixed; inset: 0; z-index: 0; display: grid; place-items: center; pointer-events: none; }
  .watermark__glow { position: absolute; width: 46vmin; height: 46vmin; border-radius: 9999px; filter: blur(60px); opacity: .45; transition: background .7s ease; background: radial-gradient(circle, rgb(var(--accent-rgb) / .55), transparent 70%); }
  .watermark img { width: 58vmin; height: 58vmin; object-fit: cover; opacity: .12; mix-blend-mode: screen; filter: blur(.6px); }

  /* Header - Fixed Size for Mobile */
  .site-header { position: sticky; top: 0; z-index: 30; border-bottom: 1px solid rgba(255,255,255,.07); background: rgba(8,8,9,.85); backdrop-filter: blur(24px); }
  .brand-row { display: flex; align-items: center; gap: .75rem; max-width: 72rem; margin: 0 auto; padding: .75rem 1rem; height: 64px; }
  .coin { position: relative; flex: none; perspective: 900px; cursor: pointer; user-select: none; }
  .coin__glow { position: absolute; inset: -.5rem; border-radius: 9999px; filter: blur(14px); pointer-events: none; transition: background .7s ease; background: radial-gradient(circle, rgb(var(--accent-rgb) / .55), transparent 72%); animation: neon-breathe 6s ease-in-out infinite; }
  .coin__disc { position: relative; display: grid; place-items: center; width: 3rem; height: 3rem; border-radius: 9999px; border: 1px solid rgb(var(--accent-rgb) / .45); background: rgba(255,255,255,.04); box-shadow: 0 0 22px -6px rgb(var(--accent-rgb) / .65); backdrop-filter: blur(12px); transform-style: preserve-3d; will-change: transform; transition: transform .3s; animation: coin-spin 9s linear infinite; }
  .coin:active .coin__disc { transform: scale(0.9); }
  .coin__face { width: 86%; height: 86%; border-radius: 9999px; overflow: hidden; mix-blend-mode: screen; }
  .coin__face img { width: 100%; height: 100%; object-fit: cover; }
  .brand { min-width: 0; flex: 1 1 auto; }
  .brand__names { display: flex; min-width: 0; align-items: baseline; gap: .5rem; }
  .brand__latin { font-family: var(--font-display); font-size: 1.25rem; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); text-shadow: 0 0 12px rgb(var(--accent-rgb) / .6); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .brand__meta { display: flex; align-items: center; gap: .375rem; margin: .25rem 0 0; font-size: 11px; color: rgba(255,255,255,.4); }
  .brand__meta svg { flex: none; width: .75rem; height: .75rem; }
  .hours-chip { display: none; }

  /* Navigation */
  .cat-nav-wrap { position: relative; }
  .cat-nav-wrap::before, .cat-nav-wrap::after { content: ''; position: absolute; top: 0; bottom: 0; width: 3rem; z-index: 10; pointer-events: none; }
  .cat-nav-wrap::before { right: 0; background: linear-gradient(to left, #080809, transparent); }
  .cat-nav-wrap::after { left: 0; background: linear-gradient(to right, #080809, transparent); }
  .cat-nav { display: flex; align-items: center; gap: .5rem; overflow-x: auto; padding: .25rem 1rem .75rem; scrollbar-width: none; }
  .cat-nav::-webkit-scrollbar { display: none; }
  .cat-chip { display: flex; flex: none; align-items: center; gap: .5rem; min-height: 48px; padding: .625rem 1rem; border-radius: 9999px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.03); color: rgba(255,255,255,.55); font-family: var(--font-display); font-size: 1.125rem; transition: all .3s; }
  .cat-chip.is-active { color: var(--accent); border-color: rgb(var(--accent-rgb) / .55); background: rgb(var(--accent-rgb) / .12); box-shadow: 0 0 15px rgb(var(--accent-rgb) / .3); }
  .cat-chip svg { width: 1rem; height: 1rem; flex: none; display: block; }
  .nav-arrow { position: absolute; top: 50%; z-index: 20; display: none; place-items: center; width: 2.25rem; height: 2.25rem; transform: translateY(-50%); border-radius: 9999px; border: 1px solid rgba(255,255,255,.1); background: rgba(13,13,17,.8); color: rgba(255,255,255,.7); backdrop-filter: blur(12px); }
  .nav-arrow--right { right: .25rem; } .nav-arrow--left { left: .25rem; }
  .nav-arrow svg { width: 1rem; height: 1rem; display: block; }

  /* Main Content */
  .page { position: relative; z-index: 10; max-width: 72rem; margin: 0 auto; padding: 2.25rem 1rem 0; }
  .panel { animation: panel-in .5s cubic-bezier(.22,1,.36,1) both; }
  .panel__head { display: flex; flex-direction: column; gap: 1.25rem; }
  .panel__latin { font-family: var(--font-latin); font-size: 10px; letter-spacing: .45em; text-transform: uppercase; color: rgba(255,255,255,.35); }
  .panel__title-row { display: flex; align-items: center; gap: .75rem; margin-top: .75rem; }
  .panel__icon { display: grid; flex: none; place-items: center; width: 2.75rem; height: 2.75rem; border-radius: 1rem; border: 1px solid rgb(var(--accent-rgb) / .4); background: rgb(var(--accent-rgb) / .1); color: var(--accent); box-shadow: 0 0 26px -10px rgb(var(--accent-rgb) / .9); backdrop-filter: blur(12px); }
  .panel__icon svg { width: 1.25rem; height: 1.25rem; }
  .panel__title { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: clamp(2rem, 6vw, 3.3rem); line-height: 1.1; color: var(--accent); text-shadow: 0 0 14px rgb(var(--accent-rgb) / .55); }
  .panel__tagline { max-width: 36rem; margin: .75rem 0 0; font-size: .875rem; line-height: 1.9; color: rgba(255,255,255,.5); }
  .panel__count { flex: none; align-self: flex-start; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.03); border-radius: 1rem; padding: .75rem 1rem; font-size: 11px; color: rgba(255,255,255,.5); backdrop-filter: blur(12px); }

  .chips { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: 1.5rem; }
  .chip { min-height: 44px; padding: .5rem 1rem; border-radius: 9999px; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.03); color: rgba(255,255,255,.55); font-size: 13px; transition: all .3s; }
  .chip.is-active { border-color: rgb(var(--accent-rgb) / .5); color: var(--accent); background: rgb(var(--accent-rgb) / .12); box-shadow: 0 10px 30px -16px rgb(var(--accent-rgb) / 1); }

  /* Cards */
  .grid { display: grid; gap: 1rem; margin-top: 1.75rem; }
  .card { position: relative; overflow: hidden; border-radius: 1.5rem; padding: 1px; background: linear-gradient(150deg, rgb(var(--accent-rgb) / .45), rgba(255,255,255,.07) 45%, rgba(255,255,255,.02)); animation: rise .5s cubic-bezier(.22,1,.36,1) both; animation-delay: calc(var(--i, 0) * 60ms); transition: transform .5s ease; }
  .card:hover { transform: translateY(-4px); }
  .card__inner { position: relative; height: 100%; border-radius: calc(1.5rem - 1px); background: rgba(255,255,255,.03); padding: 1.25rem; backdrop-filter: blur(24px); transition: background .5s ease; }
  .card:hover .card__inner { background: rgba(255,255,255,.06); }
  .card__top { position: relative; display: flex; align-items: flex-start; justify-content: space-between; gap: .75rem; }
  .card__name { margin: 0; font-family: var(--font-display); font-weight: 400; font-size: 1.5rem; line-height: 1.2; color: var(--accent); text-shadow: 0 0 12px rgb(var(--accent-rgb) / .55); }
  .card__latin { margin: .375rem 0 0; font-family: var(--font-latin); font-size: 10px; letter-spacing: .28em; text-transform: uppercase; color: rgba(255,255,255,.35); }
  .card__badge { display: flex; flex: none; align-items: center; gap: .25rem; border: 1px solid rgb(var(--accent-rgb) / .4); background: rgb(var(--accent-rgb) / .1); color: var(--accent); border-radius: 9999px; padding: .25rem .625rem; font-size: 10px; font-weight: 500; }
  .card__badge svg { width: .75rem; height: .75rem; flex: none; display: block; }
  .card__desc { position: relative; margin: .75rem 0 0; font-size: 13px; line-height: 1.9; color: rgba(255,255,255,.55); }
  .card__foot { position: relative; display: flex; align-items: center; justify-content: space-between; gap: .75rem; margin-top: 1.25rem; padding-top: 1rem; border-top: 1px solid rgba(255,255,255,.07); }
  .card__price { font-family: var(--font-display); font-size: 1.25rem; color: var(--accent); }
  .card__price small { margin-inline-start: .375rem; font-family: var(--font-body); font-size: 11px; color: rgba(255,255,255,.4); }
  .card__tags { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: .375rem; }
  .card__tag { border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.04); border-radius: 9999px; padding: .25rem .625rem; font-size: 10px; color: rgba(255,255,255,.5); }

  /* Footer */
  .site-footer { position: relative; z-index: 10; margin-top: 3rem; border-top: 1px solid rgba(255,255,255,.07); background: rgba(11,11,15,.7); backdrop-filter: blur(24px); }
  .footer-grid { display: grid; gap: 1.75rem; max-width: 72rem; margin: 0 auto; padding: 2.25rem 1rem; }
  .footer-latin { font-family: var(--font-display); font-size: .875rem; letter-spacing: .1em; color: #FFC107; }
  .footer-tagline { margin: .75rem 0 0; font-size: 13px; line-height: 1.9; color: rgba(255,255,255,.5); }
  .footer-label { display: flex; align-items: center; gap: .5rem; margin: 0; font-size: 12px; color: rgba(255,255,255,.4); }
  .footer-label svg { width: .875rem; height: .875rem; }
  .footer-value { margin: .5rem 0 0; font-size: 13px; color: rgba(255,255,255,.7); }

  /* Instagram Link Style with Icon on Left */
  .footer-link {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    margin-top: .75rem;
    font-size: 13px;
    color: rgba(255,255,255,.6);
    text-decoration: none;
    transition: color .2s;
    direction: ltr; /* Force LTR for @handle format */
  }
  .footer-link:hover { color: #fff; }
  .footer-link svg { width: 16px; height: 16px; flex-shrink: 0; }

  .footer-bottom {
    border-top: 1px solid rgba(255,255,255,.05);
    padding: 1.5rem 1rem;
    text-align: center;
    font-size: 11px;
    color: rgba(255,255,255,.35);
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }

  .freelancer-signature {
    font-size: 10px;
    color: rgba(255,255,255,0.25);
    display: flex;
    align-items: center;
    gap: 4px;
    margin-top: 5px;
  }
  .freelancer-signature a {
    color: rgba(255,255,255,0.4);
    text-decoration: none;
    transition: color 0.2s;
    font-family: var(--font-latin);
    letter-spacing: 0.5px;
  }
  .freelancer-signature a:hover { color: var(--accent); }

  @media (min-width: 640px) {
    .brand-row { gap: 1rem; padding: .75rem 1.5rem; }
    .coin__disc { width: 4rem; height: 4rem; }
    .brand__latin { font-size: 1.4rem; }
    .brand__meta { display: none; }
    .hours-chip { display: flex; flex: none; align-items: center; gap: .5rem; border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.03); border-radius: 9999px; padding: .5rem .75rem; font-size: 11px; color: rgba(255,255,255,.55); }
    .cat-nav { padding: .25rem 1.5rem .75rem; }
    .nav-arrow { display: grid; }
    .page { padding: 3rem 1.5rem 0; }
    .panel__head { flex-direction: row; align-items: flex-end; justify-content: space-between; }
    .panel__count { align-self: auto; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .footer-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); padding: 2.25rem 1.5rem; }
  }
  @media (min-width: 1280px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }

  @keyframes coin-spin { from { transform: rotateY(0deg); } to { transform: rotateY(360deg); } }
  @keyframes neon-breathe { 0%, 100% { opacity: .45; transform: scale(1); } 50% { opacity: .85; transform: scale(1.07); } }
  @keyframes rise { from { opacity: 0; transform: translateY(26px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes panel-in { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: translateY(0); } }

  /* ——————————— ADMIN PANEL STYLES (Mobile Optimized) ——————————— */
  .admin-overlay {
    position: fixed; inset: 0; z-index: 1000; background: rgba(0,0,0,0.9); backdrop-filter: blur(15px);
    display: none; align-items: flex-end; justify-content: center; opacity: 0; transition: opacity 0.3s ease;
  }
  @media(min-width: 640px) { .admin-overlay { align-items: center; } }
  .admin-overlay.active { display: flex; opacity: 1; }

  .admin-modal {
    background: #111; border: 1px solid rgba(255,193,7,0.3); border-radius: 20px 20px 0 0;
    width: 100%; max-width: 600px; max-height: 85vh; overflow-y: auto;
    box-shadow: 0 -10px 50px rgba(255,193,7,0.1); display: flex; flex-direction: column;
  }
  @media(min-width: 640px) { .admin-modal { border-radius: 20px; max-height: 90vh; } }

  .admin-header {
    padding: 15px 20px; border-bottom: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; align-items: center;
    background: rgba(255,193,7,0.05); position: sticky; top: 0; z-index: 10;
  }
  .admin-title { font-family: var(--font-display); color: var(--accent); font-size: 1.2rem; }
  .admin-close { color: #fff; font-size: 1.8rem; padding: 5px 10px; line-height: 1; }

  .admin-body { padding: 20px; display: flex; flex-direction: column; gap: 20px; }

  .admin-section { background: rgba(255,255,255,0.03); border-radius: 12px; padding: 15px; border: 1px solid rgba(255,255,255,0.05); }
  .admin-section-title { font-family: var(--font-display); color: #fff; margin-bottom: 15px; font-size: 1rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }

  .form-group { margin-bottom: 15px; }
  .form-label { display: block; font-size: 0.8rem; color: rgba(255,255,255,0.6); margin-bottom: 8px; }
  .form-input, .form-textarea {
    width: 100%; background: #080809; border: 1px solid rgba(255,255,255,0.1); color: #fff; padding: 12px;
    border-radius: 10px; font-family: var(--font-body); font-size: 0.95rem; transition: border-color 0.3s;
  }
  .form-input:focus, .form-textarea:focus { border-color: var(--accent); }
  .form-textarea { resize: vertical; min-height: 80px; }

  .btn-admin {
    padding: 10px 16px; border-radius: 10px; font-size: 0.85rem; font-weight: bold; transition: all 0.2s;
    display: inline-flex; align-items: center; justify-content: center; gap: 5px; min-height: 44px;
  }
  .btn-primary { background: var(--accent); color: #000; }
  .btn-danger { background: rgba(255,45,85,0.2); color: #ff2d55; border: 1px solid rgba(255,45,85,0.3); }
  .btn-secondary { background: rgba(255,255,255,0.1); color: #fff; }
  .btn-icon { padding: 6px 10px; min-height: 36px; }

  .category-list { display: flex; flex-direction: column; gap: 10px; }
  .category-item {
    display: flex; justify-content: space-between; align-items: center; padding: 12px;
    background: rgba(255,255,255,0.02); border-radius: 10px; border: 1px solid rgba(255,255,255,0.05);
  }
  .category-info { display: flex; align-items: center; gap: 10px; overflow: hidden; }
  .category-color-dot { width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0; }
  .category-name { font-weight:bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .item-list { display: flex; flex-direction: column; gap: 8px; margin-top: 10px; }
  .item-row {
    display: flex; justify-content: space-between; align-items: center; padding: 10px 12px;
    background: rgba(0,0,0,0.3); border-radius: 8px; font-size: 0.85rem;
  }

  /* Custom Selectors for Admin */
  .color-palette { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 5px; }
  .color-option {
    width: 36px; height: 36px; border-radius: 50%; cursor: pointer; border: 2px solid transparent;
    transition: transform 0.2s, border-color 0.2s; position: relative;
  }
  .color-option.selected { border-color: #fff; transform: scale(1.15); box-shadow: 0 0 10px rgba(255,255,255,0.3); }

  .icon-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(70px, 1fr)); gap: 8px; margin-top: 5px; }
  .icon-option {
    display: flex; flex-direction: column; align-items: center; gap: 5px; padding: 8px;
    background: rgba(255,255,255,0.03); border-radius: 8px; border: 1px solid rgba(255,255,255,0.05);
    cursor: pointer; font-size: 0.7rem; color: #aaa; transition: all 0.2s;
  }
  .icon-option svg { width: 20px; height: 20px; stroke: currentColor; }
  .icon-option.selected { background: rgba(255,193,7,0.15); border-color: var(--accent); color: var(--accent); }

  .tag-selector { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 5px; }
  .tag-option {
    padding: 6px 12px; border-radius: 20px; border: 1px solid rgba(255,255,255,0.1);
    background: rgba(255,255,255,0.03); font-size: 0.8rem; cursor: pointer; transition: all 0.2s;
  }
  .tag-option.selected { background: var(--accent); color: #000; border-color: var(--accent); font-weight: bold; }

  .admin-footer {
    padding: 15px 20px; border-top: 1px solid rgba(255,255,255,0.1); display: flex; justify-content: space-between; gap: 10px;
    background: rgba(0,0,0,0.4); position: sticky; bottom: 0;
  }

  .toast {
    position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%) translateY(100px);
    background: var(--accent); color: #000; padding: 12px 24px; border-radius: 30px;
    font-weight: bold; font-size: 0.9rem; z-index: 2000; transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    box-shadow: 0 5px 20px rgba(255,193,7,0.4); white-space: nowrap;
  }
  .toast.show { transform: translateX(-50%) translateY(0); }
</style>
</head>
<body>
  <div class="watermark" aria-hidden="true">
    <span class="watermark__glow"></span>
    <img id="wmLogo" src="" alt="" />
  </div>

  <header class="site-header">
    <div class="brand-row">
      <div class="coin" id="adminTrigger" aria-hidden="true">
        <span class="coin__glow"></span>
        <div class="coin__disc">
          <div class="coin__face"><img id="coinLogo" src="" alt="" /></div>
        </div>
      </div>

      <div class="brand">
        <div class="brand__names">
          <span class="brand__latin" id="brandLatin"></span>
        </div>
        <p class="brand__meta">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          <span id="brandHours"></span>
        </p>
      </div>
      <div class="hours-chip">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
        <span id="hoursChip"></span>
      </div>
    </div>

    <div class="cat-nav-wrap">
      <button class="nav-arrow nav-arrow--right" id="navPrev" type="button" aria-label="بخش‌های قبلی">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"/></svg>
      </button>
      <nav class="cat-nav" id="catNav" role="tablist" aria-label="بخش‌های منو"></nav>
      <button class="nav-arrow nav-arrow--left" id="navNext" type="button" aria-label="بخش‌های بعدی">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"/></svg>
      </button>
    </div>
  </header>

  <main class="page"><section id="panel"></section></main>

  <footer class="site-footer">
    <div class="footer-grid">
      <div>
        <p class="footer-latin" id="footerLatin"></p>
        <p class="footer-tagline" id="footerTagline"></p>
      </div>
      <div>
        <p class="footer-label">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/></svg>
          ساعت کار
        </p>
        <p class="footer-value" id="footerHours"></p>

        <!-- Cafe Instagram Link -->
        <a class="footer-link" href="https://instagram.com/rocco._.cafe" target="_blank" rel="noreferrer">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></svg>

      </div>

    <div class="footer-bottom">
      <span>قیمت‌ها به تومان است · منو به‌صورت زنده به‌روزرسانی می‌شود</span>

      <!-- Freelancer Signature with Instagram Icon -->
      <div class="freelancer-signature">
        ساخته شده توسط
        <a href="https://instagram.com/rez.ink_" target="_blank">
          <svg style="width:12px; height:12px; vertical-align:middle; margin-left:2px;" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="20" x="2" y="2" rx="5" ry="5"/><path d="M16 11.37A4 4 0 1 1 12.63 8 4 4 0 0 1 16 11.37z"/><line x1="17.5" x2="17.51" y1="6.5" y2="6.5"/></svg>

  <!-- Admin Panel Overlay -->
  <div class="admin-overlay" id="adminOverlay">
    <div class="admin-modal">
      <div class="admin-header">
        <h2 class="admin-title">پنل مدیریت ROCCO</h2>
        <button class="admin-close" id="adminCloseBtn">&times;</button>
      </div>
      <div class="admin-body" id="adminBody"></div>
      <div class="admin-footer">
        <button class="btn-admin btn-secondary" id="adminCancelBtn" style="flex:1">انصراف</button>
        <button class="btn-admin btn-primary" id="adminSaveBtn" style="flex:2">💾 ذخیره تغییرات</button>
      </div>
    </div>
  </div>

  <div class="toast" id="toast">تغییرات با موفقیت ذخیره شد!</div>

<script>
/* ——————————————————————————————————————————————
   DATA & CONFIGURATION
   —————————————————————————————————————————————— */
const LOGO_SRC = 'https://media.base44.com/images/public/user_6a5bd6e70461b59ad08103f6/4da3f178a_2026-10-221829.png';
const ALL_FILTER = 'همه';
const STORAGE_KEY = 'rocco_menu_data_v8';

const NEON_PALETTE = {
  amber: { primary: '#FFC107', rgb: '255 193 7' },
  cyan: { primary: '#00E5FF', rgb: '0 229 255' },
  violet: { primary: '#A78BFA', rgb: '167 139 250' },
  emerald: { primary: '#34D399', rgb: '52 211 153' },
  pink: { primary: '#FF2D55', rgb: '255 45 85' },
  lime: { primary: '#A3E635', rgb: '163 230 53' },
  orange: { primary: '#FF9F43', rgb: '255 159 67' },
  blue: { primary: '#54A0FF', rgb: '84 160 255' }
};

const CAFE_INFO = {
  latin: 'ROCCO', tagline: 'قهوه‌ی دست‌ساز، دسر تازه و صبحانه‌ای که روزت را می‌سازد.',
  hours: 'هر روز ۷:۰۰ تا ۱۳:۰۰ و ۱۷:۰۰ تا ۲۳:۰۰'
};

const INITIAL_DATA = [
  {
    id: 'hot', title: 'قهوه‌ی گرم', tagline: 'دانه‌ی تک‌خاستگاه، رست تازه‌ی هفتگی.',
    icon: 'coffee', accentKey: 'amber', filters: ['پرطرفدار', 'شیردار', 'تلخ و قوی'],
    items: [
      { id: 'h1', name: 'اسپرسو', latin: 'ESPRESSO', description: 'دبل شات، ترکیب ۷۰٪ عربیکا.', price: 95000, tags: ['تلخ و قوی', 'پرطرفدار'] },
      { id: 'h2', name: 'لاته', latin: 'CAFFE LATTE', description: 'شیر مخملی روی اسپرسو.', price: 165000, tags: ['شیردار', 'پرطرفدار'], featured: true }
    ]
  },
  {
    id: 'cold', title: 'نوشیدنی سرد', tagline: 'یخِ خردشده و ترکیب‌های خنک.',
    icon: 'snowflake', accentKey: 'cyan', filters: ['پرطرفدار', 'میوه‌ای'],
    items: [
      { id: 'c1', name: 'آیس لاته', latin: 'ICED LATTE', description: 'اسپرسو روی شیر سرد و یخ.', price: 185000, tags: ['شیردار', 'پرطرفدار'], featured: true }
    ]
  }
];

const ICONS = {
  coffee: '<path d="M10 2v2"/><path d="M14 2v2"/><path d="M6 2v2"/><path d="M16 8a1 1 0 0 1 1 1v8a4 4 0 0 1-4 4H7a4 4 0 0 1-4-4V9a1 1 0 0 1 1-1h14a4 4 0 1 1 0 8h-1"/>',
  snowflake: '<line x1="2" x2="22" y1="12" y2="12"/><line x1="12" x2="12" y1="2" y2="22"/><path d="m20 16-4-4 4-4"/><path d="m4 8 4 4-4 4"/><path d="m16 4-4 4-4-4"/><path d="m8 20 4-4 4 4"/>',
  cupsoda: '<path d="m6 8 1.75 12.28a2 2 0 0 0 2 1.72h4.54a2 2 0 0 0 2-1.72L18 8"/><path d="M5 8h14"/><path d="M7 15a6.47 6.47 0 0 1 5 0 6.47 6.47 0 0 0 5 0"/><path d="m12 8 1-6h2"/>',
  leaf: '<path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10Z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>',
  cake: '<path d="M20 21v-8a2 2 0 0 0-2-2H6a2 2 0 0 0-2 2v8"/><path d="M4 16s.5-1 2-1 2.5 2 4 2 2.5-2 4-2 2.5 2 4 2 2-1 2-1"/><path d="M2 21h20"/><path d="M7 8v3"/><path d="M12 8v3"/><path d="M17 8v3"/><path d="M7 4h.01"/><path d="M12 4h.01"/><path d="M17 4h.01"/>',
  sunrise: '<path d="M12 2v8"/><path d="m4.93 10.93 1.41 1.41"/><path d="M2 18h2"/><path d="M20 18h2"/><path d="m19.07 10.93-1.41 1.41"/><path d="M22 22H2"/><path d="m8 6 4-4 4 4"/><path d="M16 18a4 4 0 0 0-8 0"/>',
  sparkles: '<path d="m12 3-1.9 5.8a2 2 0 0 1-1.3 1.3L3 12l5.8 1.9a2 2 0 0 1 1.3 1.3L12 21l1.9-5.8a2 2 0 0 1 1.3-1.3L21 12l-5.8-1.9a2 2 0 0 1-1.3-1.3Z"/>'
};
/* نام آیکون‌های قدیمی/لاتین (Coffee، CupSoda، CakeSlice، Croissant …) هم به کلید درست تبدیل می‌شوند
   تا هیچ دسته‌ای بی‌آیکون نماند */
const ICON_ALIASES = {
  coffee: 'coffee', cafe: 'coffee', hot: 'coffee', espresso: 'coffee', bean: 'coffee',
  snowflake: 'snowflake', cold: 'snowflake', ice: 'snowflake', iced: 'snowflake', icecream: 'snowflake',
  cupsoda: 'cupsoda', brew: 'cupsoda', drink: 'cupsoda', soda: 'cupsoda', juice: 'cupsoda',
  leaf: 'leaf', tea: 'leaf', infusion: 'leaf', herbal: 'leaf', mint: 'leaf',
  cake: 'cake', cakeslice: 'cake', dessert: 'cake', sweets: 'cake', cheesecake: 'cake',
  sunrise: 'sunrise', croissant: 'sunrise', brunch: 'sunrise', breakfast: 'sunrise', food: 'sunrise',
  sparkles: 'sparkles', star: 'sparkles'
};

const resolveIcon = (name) => {
  const key = String(name == null ? '' : name).trim().toLowerCase().replace(/[\s_-]+/g, '');
  if (ICONS[key]) return key;
  if (ICON_ALIASES[key] && ICONS[ICON_ALIASES[key]]) return ICON_ALIASES[key];
  return 'coffee';
};

const iconSvg = (name) =>
  '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' +
  ICONS[resolveIcon(name)] + '</svg>';

/* متن‌های کاربر نباید ساختار HTML را بشکنند (مثل کوتیشن در value) */
const escapeHtml = (value) => String(value == null ? '' : value)
  .replace(/&/g, '&amp;')
  .replace(/</g, '&lt;')
  .replace(/>/g, '&gt;')
  .replace(/"/g, '&quot;')
  .replace(/'/g, '&#39;');

/* ——————————————————————————————————————————————
   OOP: RoccoAdmin Class
   —————————————————————————————————————————————— */
class RoccoAdmin {
  constructor(menuData) {
    this.data = JSON.parse(JSON.stringify(menuData));
    this.overlay = document.getElementById('adminOverlay');
    this.modal = this.overlay ? this.overlay.querySelector('.admin-modal') : null;
    this.body = document.getElementById('adminBody');
    this.toast = document.getElementById('toast');
    this.currentEditCatId = null;
    this.currentEditItemId = null;
    this.initListeners();
  }

  initListeners() {
    document.getElementById('adminCloseBtn').addEventListener('click', () => this.close());
    document.getElementById('adminCancelBtn').addEventListener('click', () => this.close());
    document.getElementById('adminSaveBtn').addEventListener('click', () => this.save());
    this.overlay.addEventListener('click', (e) => { if (e.target === this.overlay) this.close(); });
  }

  open() {
    /* پنل همیشه آخرین نسخهٔ مشترک را برای ویرایش باز می‌کند */
    this.data = JSON.parse(JSON.stringify(menuData));
    this.renderDashboard();
    this.overlay.classList.add('active');
    document.body.style.overflow = 'hidden';
  }

  close() {
    this.overlay.classList.remove('active');
    document.body.style.overflow = '';
    this.currentEditCatId = null;
    this.currentEditItemId = null;
  }

  showToast(msg) {
    this.toast.textContent = msg;
    this.toast.classList.add('show');
    setTimeout(() => this.toast.classList.remove('show'), 3000);
  }

  /* ——— کمکی‌ها ——— */
  get currentCat() {
    return this.data.find(c => c.id === this.currentEditCatId) || null;
  }

  get currentItem() {
    const cat = this.currentCat;
    if (!cat || !this.currentEditItemId) return null;
    return cat.items.find(i => i.id === this.currentEditItemId) || null;
  }

  scrollToTop() {
    if (this.modal) this.modal.scrollTop = 0;
  }

  getAllTags() {
    const tags = new Set([ALL_FILTER]);
    this.data.forEach(cat => {
      (cat.filters || []).forEach(t => tags.add(t));
      (cat.items || []).forEach(item => (item.tags || []).forEach(t => tags.add(t)));
    });
    return Array.from(tags);
  }

  /* ——————————————————————————————————————————
     ذخیره‌ی زنده: هر تایپ/کلیک همان لحظه روی داده اعمال می‌شود
     (قبلاً فقط هنگام ذخیره و از روی DOM خوانده می‌شد و اگر فرم
     دسته باز نبود — مثلاً بعد از رفتن به فرم محصول — از دست می‌رفت)
     —————————————————————————————————————————— */
  setCatTitle(value) {
    const cat = this.currentCat;
    if (!cat) return;
    cat.title = value;
    const display = document.getElementById('edit-cat-title-display');
    if (display) display.textContent = `ویرایش دسته: ${value.trim() || 'دسته جدید'}`;
  }

  setCatTagline(value) {
    const cat = this.currentCat;
    if (cat) cat.tagline = value;
  }

  setCatFilter(el) {
    el.classList.toggle('selected');
    const cat = this.currentCat;
    if (!cat) return;
    const box = document.getElementById('adm_cat_filters_selector');
    if (box) cat.filters = Array.from(box.querySelectorAll('.tag-option.selected')).map(o => o.dataset.val);
  }

  setItemField(field, value) {
    const item = this.currentItem;
    if (!item) return;
    if (field === 'price') item.price = parseInt(value, 10) || 0;
    else item[field] = value;
  }

  setItemTag(el) {
    el.classList.toggle('selected');
    const item = this.currentItem;
    if (!item) return;
    const box = document.getElementById('adm_item_tags_container');
    if (box) item.tags = Array.from(box.querySelectorAll('.tag-option.selected')).map(o => o.dataset.val);
  }

  setItemFeatured(checked) {
    const item = this.currentItem;
    if (item) item.featured = !!checked;
  }

  /* شبکه‌ی اطمینان: اگر فرمی هنوز باز است، مقادیرش دوباره خوانده می‌شود */
  forceSyncFromDOM() {
    const cat = this.currentCat;
    if (cat) {
      const titleEl = document.getElementById('adm_cat_title');
      if (titleEl) cat.title = titleEl.value;
      const taglineEl = document.getElementById('adm_cat_tagline');
      if (taglineEl) cat.tagline = taglineEl.value;
      const iconEl = document.getElementById('adm_cat_icon_val');
      if (iconEl) cat.icon = iconEl.value;
      const accentEl = document.getElementById('adm_cat_accent_val');
      if (accentEl) cat.accentKey = accentEl.value;
      const filtersBox = document.getElementById('adm_cat_filters_selector');
      if (filtersBox) cat.filters = Array.from(filtersBox.querySelectorAll('.tag-option.selected')).map(el => el.dataset.val);
    }

    const item = this.currentItem;
    if (item) {
      const nameEl = document.getElementById('adm_item_name');
      if (nameEl) item.name = nameEl.value;
      const latinEl = document.getElementById('adm_item_latin');
      if (latinEl) item.latin = latinEl.value;
      const priceEl = document.getElementById('adm_item_price');
      if (priceEl) item.price = parseInt(priceEl.value, 10) || 0;
      const descEl = document.getElementById('adm_item_desc');
      if (descEl) item.description = descEl.value;
      const featEl = document.getElementById('adm_item_featured');
      if (featEl) item.featured = featEl.checked;
      const tagsBox = document.getElementById('adm_item_tags_container');
      if (tagsBox) item.tags = Array.from(tagsBox.querySelectorAll('.tag-option.selected')).map(el => el.dataset.val);
    }
  }

  save() {
    this.forceSyncFromDOM();

    /* پاک‌سازی و اطمینان از سالم بودن داده‌ها */
    this.data.forEach(cat => {
      cat.title = String(cat.title || '').trim() || 'دسته بدون نام';
      cat.tagline = String(cat.tagline || '').trim();
      cat.icon = resolveIcon(cat.icon);
      cat.accentKey = NEON_PALETTE[cat.accentKey] ? cat.accentKey : 'amber';
      cat.filters = Array.isArray(cat.filters) ? cat.filters : [];
      cat.items = (Array.isArray(cat.items) ? cat.items : []).map(item => ({
        ...item,
        name: String(item.name || '').trim() || 'محصول بدون نام',
        latin: String(item.latin || '').trim(),
        description: String(item.description || '').trim(),
        price: Number(item.price) || 0,
        tags: Array.isArray(item.tags) ? item.tags : []
      }));
    });

    const drafts = this.data.filter(cat => cat.items.length === 0);
    const ready = this.data.filter(cat => cat.items.length > 0);
    this.data = ready;

    /* کش آفلاین روی همین دستگاه (اگر سرور در دسترس نبود) */
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify(ready)); } catch (err) { /* نادیده */ }

    this.pushToServer(ready, drafts.length);
  }

  /* ——— ذخیره روی حافظهٔ مشترک (سرور) ——— */
  applyLocalOnly(ready, msg) {
    menuData = normalizeCategories(ready);
    currentSignature = signatureOf(menuData);
    refreshMenu();
    this.showToast(msg);
    setTimeout(() => this.close(), 1800);
  }

  async pushToServer(ready, draftsCount) {
    const draftNote = draftsCount ? ' (' + draftsCount + ' دستهٔ بدون محصول ذخیره نشد)' : '';
    let pin = sessionStorage.getItem(PIN_KEY) || '';

    if (!pin) {
      const entered = window.prompt('کد مدیریت منو را وارد کنید');
      pin = (entered || '').trim();
    }
    if (!pin) {
      this.applyLocalOnly(ready, '⚠️ بدون کد مدیریت ذخیره نشد؛ تغییرات فقط روی همین دستگاه است');
      return;
    }

    this.showToast('⏳ در حال ذخیره روی سرور…');
    try {
      const res = await fetch(API_SAVE, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ pin: pin, categories: ready })
      });
      const json = await res.json().catch(() => ({}));

      if (res.status === 403) {
        sessionStorage.removeItem(PIN_KEY);
        this.showToast('❌ کد مدیریت درست نیست');
        return;
      }
      if (json.error === 'admin_pin_not_configured') {
        this.applyLocalOnly(ready, '⚠️ کد مدیریت روی سرور تنظیم نشده است');
        return;
      }
      if (!res.ok || !json.ok) throw new Error(json.error || 'server_error');

      sessionStorage.setItem(PIN_KEY, pin);
      menuData = normalizeCategories(json.categories || ready);
      currentSignature = signatureOf(menuData);
      refreshMenu();
      this.showToast('✅ ذخیره شد · تغییرات برای همهٔ بازدیدکنندگان اعمال می‌شود' + draftNote);
      setTimeout(() => this.close(), 1200);
    } catch (err) {
      this.applyLocalOnly(ready, '⚠️ ذخیره روی سرور انجام نشد (' + (err && err.message ? err.message : 'network') + ')؛ تغییرات فقط روی همین دستگاه ماند');
    }
  }

  /* ——— داشبورد دسته‌ها ——— */
  renderDashboard() {
    this.currentEditCatId = null;
    this.currentEditItemId = null;

    const categories = this.data;

    let html = `
      <div class="admin-section">
        <div class="admin-section-title">
          <span>مدیریت دسته‌بندی‌ها (${categories.length})</span>
          <button class="btn-admin btn-primary" onclick="admin.addCategory()">+ دسته جدید</button>
        </div>
        <div class="category-list">
          ${categories.map(cat => {
            const color = (NEON_PALETTE[cat.accentKey] || NEON_PALETTE.amber).primary;
            const count = (cat.items || []).length;
            return `
            <div class="category-item">
              <div class="category-info">
                <span class="category-color-dot" style="background:${color}"></span>
                <span class="category-name">${escapeHtml(cat.title)}</span>
                <span style="font-size:0.75rem; color:#888; margin-right:5px">(${count > 0 ? count + ' محصول' : 'بدون محصول'})</span>
              </div>
              <div style="display:flex; gap:5px; flex-shrink:0">
                <button class="btn-admin btn-secondary btn-icon" onclick="admin.editCategory('${cat.id}')">✏️</button>
                <button class="btn-admin btn-danger btn-icon" onclick="admin.deleteCategory('${cat.id}')">🗑️</button>
              </div>
            </div>`;
          }).join('')}
          ${categories.length === 0 ? '<div style="text-align:center; padding:20px; color:#666; font-size:0.85rem">هنوز دسته‌بندی ثبت شده‌ای وجود ندارد</div>' : ''}
        </div>
      </div>
    `;
    this.body.innerHTML = html;
    this.scrollToTop();
  }

  addCategory() {
    const newId = 'cat_' + Date.now();
    this.data.push({
      id: newId, title: 'دسته جدید', tagline: '', icon: 'coffee', accentKey: 'amber', filters: [], items: []
    });
    this.editCategory(newId);
  }

  editCategory(id) {
    this.currentEditCatId = id;
    this.currentEditItemId = null;
    const cat = this.currentCat;
    if (!cat) return;

    const allTags = this.getAllTags();
    const activeFilters = new Set(cat.filters || []);

    let html = `
      <div class="admin-section">
        <div class="admin-section-title">
          <span id="edit-cat-title-display">ویرایش دسته: ${escapeHtml(cat.title)}</span>
          <button class="btn-admin btn-secondary" onclick="admin.renderDashboard()">↩ بازگشت</button>
        </div>

        <div class="form-group">
          <label class="form-label">نام فارسی دسته *</label>
          <input class="form-input" id="adm_cat_title" value="${escapeHtml(cat.title)}" oninput="admin.setCatTitle(this.value)">
        </div>
        <div class="form-group">
          <label class="form-label">توضیحات کوتاه (Tagline)</label>
          <textarea class="form-textarea" id="adm_cat_tagline" oninput="admin.setCatTagline(this.value)">${escapeHtml(cat.tagline)}</textarea>
        </div>

        <div class="form-group">
          <label class="form-label">رنگ نئون دسته</label>
          <input type="hidden" id="adm_cat_accent_val" value="${escapeHtml(cat.accentKey)}">
          <div class="color-palette" id="adm_cat_color_palette">
            ${Object.entries(NEON_PALETTE).map(([key, val]) =>
              `<div class="color-option ${cat.accentKey === key ? 'selected' : ''}"
                style="background:${val.primary}"
                onclick="admin.selectColor('adm_cat_accent_val', '${key}', this)"
                title="${key}"></div>`
            ).join('')}
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">آیکون دسته</label>
          <input type="hidden" id="adm_cat_icon_val" value="${resolveIcon(cat.icon)}">
          <div class="icon-grid" id="adm_cat_icon_grid">
            ${Object.keys(ICONS).map(k =>
              `<div class="icon-option ${resolveIcon(cat.icon) === k ? 'selected' : ''}" onclick="admin.selectIcon('adm_cat_icon_val', '${k}', this)">
                ${iconSvg(k)} <span>${k}</span>
              </div>`
            ).join('')}
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">فیلترهای این دسته (انتخاب کنید)</label>
          <div class="tag-selector" id="adm_cat_filters_selector">
            ${allTags.map(t =>
              `<div class="tag-option ${activeFilters.has(t) ? 'selected' : ''}"
                onclick="admin.setCatFilter(this)" data-val="${escapeHtml(t)}">${escapeHtml(t)}</div>`
            ).join('')}
          </div>
        </div>

        <hr style="border:0; border-top:1px solid rgba(255,255,255,0.1); margin: 20px 0">

        <div class="admin-section-title">
          <span>محصولات این دسته (${cat.items.length})</span>
          <button class="btn-admin btn-primary" onclick="admin.addItemToCurrentCat()">+ محصول جدید</button>
        </div>
        <div class="item-list">
          ${cat.items.map(item => `
            <div class="item-row">
              <div style="overflow:hidden">
                <div style="font-weight:bold; color:var(--accent); white-space:nowrap; overflow:hidden; text-overflow:ellipsis">${escapeHtml(item.name)}</div>
                <div style="font-size:0.75rem; color:#888">${faNum(item.price)} تومان</div>
              </div>
              <div class="item-actions" style="display:flex; gap:5px; flex-shrink:0">
                <button class="btn-admin btn-secondary btn-icon" onclick="admin.editItem('${cat.id}', '${item.id}')">✏️</button>
                <button class="btn-admin btn-danger btn-icon" onclick="admin.deleteItem('${cat.id}', '${item.id}')">🗑️</button>
              </div>
            </div>
          `).join('')}
          ${cat.items.length === 0 ? '<div style="text-align:center; padding:20px; color:#666; font-size:0.85rem">هنوز محصولی اضافه نشده است. برای فعال‌سازی این دسته حداقل یک محصول اضافه کنید.</div>' : ''}
        </div>
      </div>
    `;
    this.body.innerHTML = html;
    this.scrollToTop();
  }

  selectColor(inputId, val, el) {
    document.getElementById(inputId).value = val;
    el.parentElement.querySelectorAll('.color-option').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');

    const cat = this.currentCat;
    if (cat) cat.accentKey = val;
  }

  selectIcon(inputId, val, el) {
    document.getElementById(inputId).value = val;
    el.parentElement.querySelectorAll('.icon-option').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');

    const cat = this.currentCat;
    if (cat) cat.icon = val;
  }

  deleteCategory(id) {
    if (confirm('آیا از حذف این دسته و تمام محصولات آن مطمئن هستید؟')) {
      this.data = this.data.filter(c => c.id !== id);
      if (this.currentEditCatId === id) {
        this.currentEditCatId = null;
        this.currentEditItemId = null;
      }
      this.renderDashboard();
    }
  }

  addItemToCurrentCat() {
    const cat = this.currentCat;
    if (!cat) return;

    /* اگر محصول نیمه‌کاره‌ی خالی از قبل هست، همان باز شود (جلوگیری از تکرار) */
    const placeholder = cat.items.find(item =>
      item.name === 'محصول جدید' && !item.latin && !item.description && !Number(item.price)
    );
    if (placeholder) {
      this.editItem(cat.id, placeholder.id);
      return;
    }

    const newItem = {
      id: 'item_' + Date.now(), name: 'محصول جدید', latin: '',
      description: '', price: 0, tags: [], featured: false
    };
    cat.items.push(newItem);
    this.editItem(cat.id, newItem.id);
  }

  editItem(catId, itemId) {
    const cat = this.data.find(c => c.id === catId);
    const item = cat && cat.items.find(i => i.id === itemId);
    if (!item) return;

    this.currentEditCatId = catId;
    this.currentEditItemId = itemId;

    const allTags = this.getAllTags();
    const activeTags = new Set(item.tags || []);

    let html = `
      <div class="admin-section">
        <div class="admin-section-title">
          <span>ویرایش محصول</span>
          <button class="btn-admin btn-secondary" onclick="admin.editCategory('${catId}')">↩ بازگشت به دسته</button>
        </div>
        <div style="display:grid; grid-template-columns: 1fr 1fr; gap:10px">
          <div class="form-group"><label class="form-label">نام فارسی *</label><input class="form-input" id="adm_item_name" value="${escapeHtml(item.name)}" oninput="admin.setItemField('name', this.value)"></div>
          <div class="form-group"><label class="form-label">نام لاتین *</label><input class="form-input" id="adm_item_latin" value="${escapeHtml(item.latin)}" oninput="admin.setItemField('latin', this.value)"></div>
        </div>
        <div class="form-group"><label class="form-label">قیمت (تومان) *</label><input type="number" class="form-input" id="adm_item_price" value="${item.price}" oninput="admin.setItemField('price', this.value)"></div>
        <div class="form-group"><label class="form-label">توضیحات محصول</label><textarea class="form-textarea" id="adm_item_desc" oninput="admin.setItemField('description', this.value)">${escapeHtml(item.description)}</textarea></div>

        <div class="form-group">
          <label class="form-label">تگ‌های محصول (انتخاب کنید)</label>
          <div class="tag-selector" id="adm_item_tags_container">
            ${allTags.map(t =>
              `<div class="tag-option ${activeTags.has(t) ? 'selected' : ''}"
                onclick="admin.setItemTag(this)" data-val="${escapeHtml(t)}">${escapeHtml(t)}</div>`
            ).join('')}
          </div>
        </div>

        <div class="form-group" style="display:flex; align-items:center; gap:10px; margin-top:10px; padding:10px; background:rgba(255,193,7,0.05); border-radius:8px">
          <input type="checkbox" id="adm_item_featured" ${item.featured ? 'checked' : ''} onchange="admin.setItemFeatured(this.checked)" style="width:20px; height:20px; accent-color:var(--accent)">
          <label for="adm_item_featured" style="color:#fff; font-size:0.9rem; cursor:pointer">⭐ پیشنهاد ویژه باریستا</label>
        </div>
      </div>
    `;
    this.body.innerHTML = html;
    this.scrollToTop();
  }

  deleteItem(catId, itemId) {
    if (confirm('آیا از حذف این محصول مطمئن هستید؟')) {
      const cat = this.data.find(c => c.id === catId);
      if (!cat) return;
      cat.items = cat.items.filter(i => i.id !== itemId);
      if (this.currentEditItemId === itemId) this.currentEditItemId = null;
      this.editCategory(catId);
    }
  }
}

/* ——————————————————————————————————————————————
   MAIN APP LOGIC
   —————————————————————————————————————————————— */
let menuData = [];
let state = { cat: 0, filter: ALL_FILTER };
const $ = (id) => document.getElementById(id);
const faNum = (val) => Number(val).toLocaleString('fa-IR');

/* ——————————————————————————————————————————————
   حافظهٔ مشترک منو روی سرور:
   هر تغییری که مدیر ذخیره می‌کند روی سرور نوشته می‌شود و
   هر بازدیدکننده (لینک یا QR) حداکثر تا ۱۵ ثانیه همان را می‌بیند.
   —————————————————————————————————————————————— */
/* آدرس کامل سرور مشترک: صفحه از هر دامنه‌ای باز شود (گیت‌هاب، QR روی میز، …)
   داده‌ها را از همین سرور می‌خواند و روی همین سرور ذخیره می‌کند */
const API_ORIGIN = 'https://base44.app/api/apps/6ada5bcf8b28629c9afca2dd';
const API_GET = API_ORIGIN + '/functions/getMenu';
const API_SAVE = API_ORIGIN + '/functions/saveMenu';
const PIN_KEY = 'rocco_admin_pin';
let currentSignature = '';

const signatureOf = (list) => JSON.stringify(list);

function readLocalRaw() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    const parsed = saved ? JSON.parse(saved) : JSON.parse(JSON.stringify(INITIAL_DATA));
    return Array.isArray(parsed) ? parsed : JSON.parse(JSON.stringify(INITIAL_DATA));
  } catch (e) {
    return JSON.parse(JSON.stringify(INITIAL_DATA));
  }
}

function normalizeCategories(list) {
  return (Array.isArray(list) ? list : [])
    .filter(cat => cat && Array.isArray(cat.items) && cat.items.length > 0)
    .map(cat => ({
      ...cat,
      title: String(cat.title || '').trim() || 'دسته بدون نام',
      tagline: String(cat.tagline || ''),
      /* آیکون و رنگ همیشه به یک مقدار معتبر تبدیل می‌شوند تا هیچ دسته‌ای بدون آیکون نماند */
      icon: resolveIcon(cat.icon),
      accentKey: NEON_PALETTE[cat.accentKey] ? cat.accentKey : 'amber',
      filters: Array.isArray(cat.filters) ? cat.filters : [],
      items: cat.items.map(item => ({
        ...item,
        name: String(item.name || ''),
        price: Number(item.price) || 0,
        tags: Array.isArray(item.tags) ? item.tags : []
      }))
    }));
}

function loadData() {
  menuData = normalizeCategories(readLocalRaw());
  currentSignature = signatureOf(menuData);
}

async function fetchServerMenu() {
  const res = await fetch(API_GET + '?t=' + Date.now(), { cache: 'no-store' });
  if (!res.ok) return null;
  const json = await res.json();
  if (!json || !json.ok || !Array.isArray(json.categories) || !json.categories.length) return null;
  return json;
}

async function syncFromServer() {
  try {
    if (admin && admin.overlay && admin.overlay.classList.contains('active')) return;
  } catch (e) { /* پنل هنوز آماده نیست */ }

  try {
    const json = await fetchServerMenu();
    if (!json) return;
    const next = normalizeCategories(json.categories);
    const nextSignature = signatureOf(next);
    if (nextSignature === currentSignature) return;

    menuData = next;
    currentSignature = nextSignature;
    if (state.cat >= menuData.length) state.cat = 0;
    renderNav();
    renderPanel();
  } catch (e) { /* آفلاین: نسخهٔ ذخیره‌شده روی همین دستگاه نمایش داده می‌شود */ }
}

function applyAccent(accentObj) {
  const root = document.documentElement.style;
  root.setProperty('--accent', accentObj.primary);
  root.setProperty('--accent-rgb', accentObj.rgb);
}

function renderNav() {
  $('catNav').innerHTML = menuData.map((cat, i) => {
    const accent = NEON_PALETTE[cat.accentKey] || NEON_PALETTE.amber;
    return `<button type="button" role="tab" data-index="${i}" aria-selected="${i === state.cat}"
      class="cat-chip ${i === state.cat ? 'is-active' : ''}"
      style="--accent:${accent.primary}; --accent-rgb:${accent.rgb}">
      ${iconSvg(cat.icon)} <span>${escapeHtml(cat.title)}</span></button>`;
  }).join('');

  const active = $('catNav').querySelector('.is-active');
  if (active) active.scrollIntoView({ behavior: 'smooth', inline: 'center', block: 'nearest' });
}

function refreshMenu() {
  if (!menuData.length || state.cat >= menuData.length) state.cat = 0;
  renderNav();
  renderPanel();
}

function cardHTML(item, index) {
  const accent = NEON_PALETTE[menuData[state.cat].accentKey] || NEON_PALETTE.amber;
  const tags = item.tags.length ? `<div class="card__tags">${item.tags.map(t => `<span class="card__tag">${escapeHtml(t)}</span>`).join('')}</div>` : '';
  const featured = item.featured ? `<span class="card__badge">${iconSvg('sparkles')} پیشنهاد باریستا</span>` : '';
  const latin = item.latin ? `<p class="card__latin">${escapeHtml(item.latin)}</p>` : '';

  return `<article class="card" style="--i:${index}; --accent:${accent.primary}; --accent-rgb:${accent.rgb}">
    <div class="card__inner">
      <div class="card__top">
        <div class="card__names"><h3 class="card__name">${escapeHtml(item.name)}</h3>${latin}</div>
        ${featured}
      </div>
      <p class="card__desc">${escapeHtml(item.description)}</p>
      <div class="card__foot">
        <span class="card__price">${faNum(item.price)} <small>تومان</small></span>
        ${tags}
      </div>
    </div>
  </article>`;
}

function renderPanel() {
  if (menuData.length === 0) {
    $('panel').innerHTML = '<div style="text-align:center; padding:50px; color:#666">منو خالی است</div>';
    return;
  }

  const cat = menuData[state.cat];
  if (!cat) {
    $('panel').innerHTML = '<div style="text-align:center; padding:50px; color:#666">منو خالی است</div>';
    return;
  }

  const accent = NEON_PALETTE[cat.accentKey] || NEON_PALETTE.amber;
  const items = state.filter === ALL_FILTER ? cat.items : cat.items.filter(i => i.tags.includes(state.filter));

  const chips = [ALL_FILTER, ...(cat.filters || [])].map(chip =>
    `<button type="button" class="chip ${chip === state.filter ? 'is-active' : ''}" data-filter="${escapeHtml(chip)}">${escapeHtml(chip)}</button>`
  ).join('');

  const body = items.length
    ? `<div class="grid">${items.map((item, idx) => cardHTML(item, idx)).join('')}</div>`
    : `<div class="empty" style="margin-top:1.75rem; border:1px solid rgba(255,255,255,.1); background:rgba(255,255,255,.03); border-radius:1.5rem; padding:2.5rem; text-align:center; color:rgba(255,255,255,.5)">آیتمی با این ویژگی یافت نشد.</div>`;

  $('panel').innerHTML = `<section class="panel" style="--accent:${accent.primary}; --accent-rgb:${accent.rgb}">
    <div class="panel__head">
      <div>
        <span class="panel__latin">${escapeHtml(cat.latin || '')}</span>
        <div class="panel__title-row">
          <span class="panel__icon">${iconSvg(cat.icon)}</span>
          <h2 class="panel__title">${escapeHtml(cat.title)}</h2>
        </div>
        <p class="panel__tagline">${escapeHtml(cat.tagline)}</p>
      </div>
      <div class="panel__count">${faNum(items.length)} از ${faNum(cat.items.length)} آیتم</div>
    </div>
    <div class="chips">${chips}</div>
    ${body}
  </section>`;

  applyAccent(accent);
}

$('catNav').addEventListener('click', (e) => {
  const chip = e.target.closest('.cat-chip');
  if (!chip) return;
  const index = Number(chip.dataset.index);
  if (index === state.cat) return;
  state.cat = index;
  state.filter = ALL_FILTER;
  renderNav();
  renderPanel();
});

$('panel').addEventListener('click', (e) => {
  const chip = e.target.closest('.chip');
  if (!chip) return;
  state.filter = chip.dataset.filter;
  renderPanel();
});

$('navPrev').addEventListener('click', () => $('catNav').scrollBy({ left: 280, behavior: 'smooth' }));
$('navNext').addEventListener('click', () => $('catNav').scrollBy({ left: -280, behavior: 'smooth' }));

let coinFrame = 0;
window.addEventListener('scroll', () => {
  cancelAnimationFrame(coinFrame);
  coinFrame = requestAnimationFrame(() => {
    const progress = Math.min(1, window.scrollY / 700);
    document.documentElement.style.setProperty('--coin-duration', (9 - progress * 4.5) + 's');
  });
}, { passive: true });

let tapCount = 0;
let tapTimer = null;
$('adminTrigger').addEventListener('click', () => {
  tapCount++;
  clearTimeout(tapTimer);
  tapTimer = setTimeout(() => { tapCount = 0; }, 2000);
  if (tapCount >= 5) {
    tapCount = 0;
    admin.open();
  }
});

loadData();
refreshMenu();

$('wmLogo').src = LOGO_SRC;
$('coinLogo').src = LOGO_SRC;
$('brandLatin').textContent = CAFE_INFO.latin;
$('brandHours').textContent = CAFE_INFO.hours;
$('hoursChip').textContent = CAFE_INFO.hours;
$('footerLatin').textContent = CAFE_INFO.latin;
$('footerTagline').textContent = CAFE_INFO.tagline;
$('footerHours').textContent = CAFE_INFO.hours;

const admin = new RoccoAdmin(menuData);

/* دریافت نسخهٔ مشترک از سرور و همگام‌سازی زنده با پنل مدیریت */
syncFromServer();
setInterval(syncFromServer, 15000);
document.addEventListener('visibilitychange', () => { if (!document.hidden) syncFromServer(); });
</script>
</body>
</html>
